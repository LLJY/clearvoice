wireplumber.settings.schema = {
  clearvoice.lock-base-mic-audio = {
    name = "Lock ClearVoice base microphone"
    description = "Hide the base microphone while the ClearVoice source is available"
    type = "bool"
    default = false
  }
  clearvoice.base-mic-node = {
    name = "ClearVoice base microphone node"
    description = "Physical source used by ClearVoice"
    type = "string"
    default = ""
  }
  clearvoice.base-mic-gain = {
    name = "ClearVoice base microphone gain"
    description = "Locked physical microphone gain on a cubic scale"
    type = "float"
    default = 0.7
    min = 0.0
    max = 1.0
  }
  clearvoice.lock-output-volume = {
    name = "Lock ClearVoice output volume"
    description = "Keep the processed ClearVoice source at unity gain"
    type = "bool"
    default = true
  }
}

wireplumber.components = [
  {
    name = "90-clearvoice-lock.lua", type = script/lua
    provides = hooks.clearvoice.lock-base-mic
    requires = [ api.mixer ]
  }
]

wireplumber.profiles = {
  main = {
    hooks.clearvoice.lock-base-mic = required
  }
}
